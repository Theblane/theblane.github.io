<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blane Maher</title>
  <meta name="description" content="Blane Maher — Director of Enterprise Systems. Iowa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #efebe4;
      --fg: #1c1917;
      --muted: #78716c;
      --rule: #d6d3d1;
      --accent: #9a3412;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 3rem 2rem;
      background-image:
        linear-gradient(var(--rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: 56px 56px;
      background-position: -1px -1px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at top, transparent 0%, var(--bg) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 6rem);
      gap: 3rem;
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .meta {
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 11px;
      color: var(--muted);
    }

    .meta .accent { color: var(--accent); }
    .pulse {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.4rem;
      animation: pulse 2.4s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    main { padding-top: 1rem; }

    .name {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.5rem, 11vw, 7rem);
      line-height: 0.92;
      letter-spacing: -0.025em;
      font-variation-settings: "opsz" 144, "SOFT" 50;
    }

    .name .dot { color: var(--accent); }

    .bio {
      max-width: 460px;
      margin-top: 2rem;
      font-size: 14px;
      line-height: 1.75;
    }

    .bio em {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      color: var(--accent);
      font-size: 1.05em;
    }

    .links {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--rule);
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      color: var(--fg);
      transition: padding-left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.25s ease;
    }

    .link:hover {
      padding-left: 0.85rem;
      color: var(--accent);
    }

    .link-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .link-text {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.1;
    }

    .link-arrow {
      font-size: 16px;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      color: var(--muted);
    }

    .link:hover .link-arrow {
      transform: translateX(8px);
      color: var(--accent);
    }

    .footer {
      margin-top: auto;
      padding-top: 3rem;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      body { padding: 2rem 1.25rem; background-size: 40px 40px; }
      .link { padding: 1.1rem 0; }
      .link-text { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="meta">
      <span>Blane Maher</span>
      <span class="accent"><span class="pulse"></span>Available</span>
    </header>

    <main>
      <h1 class="name">Blane<br />Maher<span class="dot">.</span></h1>
      <p class="bio">
        Director of Enterprise Systems. Building <em>practical automations</em>
        across ERP, logistics, and hardware. Based in Iowa.
      </p>
    </main>

    <section class="links" aria-label="Links">
      <a class="link" href="https://www.linkedin.com/in/blanemaher" target="_blank" rel="noopener noreferrer">
        <div>
          <div class="link-label">01 — Network</div>
          <div class="link-text">LinkedIn</div>
        </div>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>
      <a class="link" href="https://github.com/Theblane" target="_blank" rel="noopener noreferrer">
        <div>
          <div class="link-label">02 — Code</div>
          <div class="link-text">GitHub</div>
        </div>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer class="footer">
      <span>Northwood, IA</span>
      <span>© 2026</span>
    </footer>
  </div>
</body>
</html>
